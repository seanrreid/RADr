name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Linux also builds the stack sandbox images and runs every container e2e.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run lint
      - run: node dist/scripts/check-deps.js
      # Real pinned toolchain for the e2e suite (checksum-verified downloads).
      - name: Install radr toolchain
        run: node bin/radr.js tools install
        env:
          RADR_HOME: ${{ runner.temp }}/radr-tools
      - name: Rule pack (provenance, licenses, unmodified, every rule passes its fixtures)
        run: OPENGREP="$(ls "$RADR_HOME"/tools/opengrep/*/opengrep_* | head -1)" node dist/scripts/check-rules.js
        env:
          RADR_HOME: ${{ runner.temp }}/radr-tools
      - name: Test (unit + real-tools e2e)
        run: node --test "dist/test/**/*.test.js"
        env:
          RADR_E2E_TOOLS: ${{ runner.temp }}/radr-tools
          # The sandbox e2e needs a container runtime; GitHub's Linux runners have Docker.
          RADR_E2E_SANDBOX: ${{ runner.os == 'Linux' && '1' || '0' }}
