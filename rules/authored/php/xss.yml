rules:
- id: radr.php.xss
  languages: [php]
  severity: ERROR
  message: >-
    Request input is written to the response without HTML encoding. Encode it with htmlspecialchars($value, ENT_QUOTES, 'UTF-8') (or e() in Laravel) at output.
  metadata:
    cwe: ["CWE-79: Cross-site Scripting"]
    owasp: ["A03:2021 - Injection"]
    source: radr
  mode: taint
  pattern-sources:
  - pattern-either:
    - pattern: $_GET
    - pattern: $_POST
    - pattern: $_REQUEST
    - pattern: $_COOKIE
    - pattern: $_FILES
    - pattern: file_get_contents("php://input")
    - patterns:
      - pattern: $REQ->$M(...)
      - metavariable-regex:
          metavariable: $REQ
          regex: ^\$(request|req)$
      - metavariable-regex:
          metavariable: $M
          regex: ^(input|query|get|post|cookie|header|all|string|integer|json|route)$
  pattern-sanitizers:
  - pattern-either:
    - pattern: htmlspecialchars(...)
    - pattern: htmlentities(...)
    - pattern: e(...)
    - pattern: intval(...)
    - pattern: json_encode(...)
  pattern-sinks:
  - pattern-either:
    - pattern: echo ...;
    - pattern: print(...)
    - pattern: printf(...)
    - pattern: vprintf(...)
