rules:
- id: radr.php.unserialize
  languages: [php]
  severity: ERROR
  message: >-
    Request input is passed to unserialize(), which can instantiate arbitrary objects (POP-chain RCE). Use json_decode() for data exchange.
  metadata:
    cwe: ["CWE-502: Deserialization of Untrusted Data"]
    owasp: ["A08:2021 - Software and Data Integrity Failures"]
    source: radr
  mode: taint
  pattern-sources:
  - pattern-either:
    - pattern: $_GET
    - pattern: $_POST
    - pattern: $_REQUEST
    - pattern: $_COOKIE
    - pattern: $_FILES
    - pattern: file_get_contents("php://input")
    - patterns:
      - pattern: $REQ->$M(...)
      - metavariable-regex:
          metavariable: $REQ
          regex: ^\$(request|req)$
      - metavariable-regex:
          metavariable: $M
          regex: ^(input|query|get|post|cookie|header|all|string|integer|json|route)$
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: unserialize($X, ...)
      - pattern: maybe_unserialize($X)
    - focus-metavariable: $X
