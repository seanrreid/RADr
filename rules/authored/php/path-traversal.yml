rules:
- id: radr.php.path-traversal
  languages: [php]
  severity: ERROR
  message: >-
    Request input is used as a filesystem path. Reduce it to a file name with basename() and check the resolved realpath() stays inside the intended directory.
  metadata:
    cwe: ["CWE-22: Path Traversal"]
    owasp: ["A01:2021 - Broken Access Control"]
    source: radr
  mode: taint
  pattern-sources:
  - pattern-either:
    - pattern: $_GET
    - pattern: $_POST
    - pattern: $_REQUEST
    - pattern: $_COOKIE
    - pattern: $_FILES
    - pattern: file_get_contents("php://input")
    - patterns:
      - pattern: $REQ->$M(...)
      - metavariable-regex:
          metavariable: $REQ
          regex: ^\$(request|req)$
      - metavariable-regex:
          metavariable: $M
          regex: ^(input|query|get|post|cookie|header|all|string|integer|json|route)$
  pattern-sanitizers:
  - pattern-either:
    - pattern: basename(...)
    - pattern: intval(...)
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: fopen($X, ...)
      - pattern: readfile($X, ...)
      - pattern: file($X, ...)
      - pattern: file_put_contents($X, ...)
      - pattern: unlink($X, ...)
      - pattern: copy($X, ...)
      - pattern: rename($X, ...)
      - pattern: $R->download($X, ...)
      - pattern: $R->file($X, ...)
    - focus-metavariable: $X
