rules:
- id: radr.php.file-inclusion
  languages: [php]
  severity: ERROR
  message: >-
    Request input selects a file to include/require, which lets an attacker run arbitrary PHP. Map allowed names to fixed paths instead.
  metadata:
    cwe: ["CWE-98: PHP Remote File Inclusion"]
    owasp: ["A03:2021 - Injection"]
    source: radr
  mode: taint
  pattern-sources:
  - pattern-either:
    - pattern: $_GET
    - pattern: $_POST
    - pattern: $_REQUEST
    - pattern: $_COOKIE
    - pattern: $_FILES
    - pattern: file_get_contents("php://input")
    - patterns:
      - pattern: $REQ->$M(...)
      - metavariable-regex:
          metavariable: $REQ
          regex: ^\$(request|req)$
      - metavariable-regex:
          metavariable: $M
          regex: ^(input|query|get|post|cookie|header|all|string|integer|json|route)$
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: include $X;
      - pattern: include_once $X;
      - pattern: require $X;
      - pattern: require_once $X;
    - focus-metavariable: $X
