rules:
- id: radr.php.code-injection
  languages: [php]
  severity: ERROR
  message: >-
    Request input is evaluated as PHP code. Never eval input; map allowed values to code explicitly.
  metadata:
    cwe: ["CWE-94: Code Injection"]
    owasp: ["A03:2021 - Injection"]
    source: radr
  mode: taint
  pattern-sources:
  - pattern-either:
    - pattern: $_GET
    - pattern: $_POST
    - pattern: $_REQUEST
    - pattern: $_COOKIE
    - pattern: $_FILES
    - pattern: file_get_contents("php://input")
    - patterns:
      - pattern: $REQ->$M(...)
      - metavariable-regex:
          metavariable: $REQ
          regex: ^\$(request|req)$
      - metavariable-regex:
          metavariable: $M
          regex: ^(input|query|get|post|cookie|header|all|string|integer|json|route)$
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: eval($X)
      - pattern: assert($X, ...)
      - pattern: create_function($A, $X)
      - pattern: call_user_func($X, ...)
      - pattern: call_user_func_array($X, ...)
      - pattern: preg_replace($X, ...)
    - focus-metavariable: $X
