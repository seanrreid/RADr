# rubric/v1.yml — severity, disposition, scorecard, and effort rules.
# Status: DRAFT (2026-10-07). See PRD §8 (dispositions), §10 (severity), §5 (triage scorecard).
#
# The rubric is DATA. radr loads it, and its content hash is part of the scope fingerprint.
# Any change ships as a new version file (v2.yml); a version is never edited after first use.
#
# Determinism rules for this file:
#   - No floats. Percentages are integer percent or basis points (bp: 1% = 100 bp).
#     CVSS uses tenths (cvss_x10: 9.0 → 90). EPSS uses bp (0.10 → 1000).
#   - Every lookup is exhaustive. An unmapped (tool, tool_severity) pair is an ERROR, never a default.
#   - Modifiers apply in the order listed, each moving at most one step, clamped to [info, critical].

version: 1
severities: [info, low, medium, high, critical]   # ordered low → high

# Client-facing definitions (rendered in every report's methodology section).
definitions:
  critical: "Likely exploitable now with serious impact (data breach, takeover, known-exploited vuln). Fix immediately."
  high:     "Exploitable or high-impact weakness requiring attention this cycle."
  medium:   "Real weakness or significant quality risk; schedule remediation."
  low:      "Minor weakness or quality issue; fix opportunistically."
  info:     "Observation or metric context; no action required on its own."

# --- 1. Base mapping: (tool, tool_severity) → severity ------------------------------------------
base:
  eslint:      { "2": low, "1": info }                 # eslint JSON: 2=error, 1=warning
  ruff:        { error: low, warning: info, note: info }
  gitleaks:    { error: high, warning: high, note: high }   # every secret starts at high (see rule overrides)
  osv-scanner: { from: cvss }                          # SCA uses section 2, not tool severity
  opengrep:    { ERROR: high, WARNING: medium, INFO: low }
  bandit:      { HIGH: high, MEDIUM: medium, LOW: low }
  gosec:       { HIGH: high, MEDIUM: medium, LOW: low }
  checkov:     { CRITICAL: critical, HIGH: high, MEDIUM: medium, LOW: low, UNKNOWN: medium }  # OSS checkov often reports no severity → UNKNOWN
  scancode:    { from: license }                       # section 4
  # M3 tools (golangci-lint, clippy, PMD, detekt, PHPStan, RuboCop, NetAnalyzers, SpotBugs,
  # Psalm, hadolint, trivy-config) are added here as their adapters land. The loader fails
  # closed if an enabled lane uses a tool that has no entry.

# Rule-level overrides: exact (tool, rule_id) → severity. Applied before modifiers.
# Rule IDs must exist in the pinned tool version: at load time, radr checks them against the
# tool's rule list (e.g., gitleaks' default config), and an unknown ID fails closed.
rule_overrides:
  gitleaks:
    private-key: critical
    aws-access-token: critical
    gcp-service-account: critical
    github-pat: critical
    stripe-access-token: critical
    generic-api-key: medium        # high false-positive rate; stays in the review set regardless

# --- 2. Vulnerabilities (SCA, and SAST findings carrying a CVE) ---------------------------------
vulnerabilities:
  cvss_bands_x10:                   # CVSS v3.1/v4 base score, qualitative scale
    - { min: 90, severity: critical }
    - { min: 70, severity: high }
    - { min: 40, severity: medium }
    - { min: 1,  severity: low }
    - { min: 0,  severity: info }
  no_cvss: medium                   # advisory without a score
  promote:                          # promotion only, never demotion (conservative, defensible)
    - { if: kev_listed, to: critical }           # CISA Known Exploited Vulnerabilities (snapshot via `radr db sync`)
    - { if: epss_bp_gte_1000, steps: 1 }        # EPSS ≥ 10% exploitation probability within 30 days
  # A finding records which inputs fired (cvss_x10, epss_bp, kev) so the report can explain its severity.

# --- 3. Path modifiers ---------------------------------------------------------------------------
path_modifiers:
  demote_one:                       # non-production code
    globs: ["**/test/**", "**/tests/**", "**/__tests__/**", "**/*.test.*", "**/*.spec.*",
            "**/fixtures/**", "**/examples/**", "**/docs/**", "**/testdata/**"]
    applies_to: [quality, maintainability, security, iac]
    except_lanes: [secrets]         # a real credential in a test file is still a real credential
  promote_one:
    globs: ["**/auth/**", "**/authn/**", "**/authz/**", "**/security/**", "**/crypto/**",
            "**/payment*/**", "**/billing/**", "**/admin/**"]
    applies_to: [security]          # SAST only; quality findings are not promoted by path

# --- 4. License findings -------------------------------------------------------------------------
license:
  strong_copyleft_dependency: high      # GPL/AGPL in a dependency of distributed or SaaS software
  weak_copyleft_dependency: low         # LGPL/MPL/EPL: obligations, rarely blocking
  non_commercial_or_proprietary: high   # CC-BY-NC, "all rights reserved", custom restrictive
  unknown_or_missing: medium
  # In `due-diligence` engagements, strong_copyleft and non_commercial are promoted to critical.
  engagement_overrides:
    due-diligence: { strong_copyleft_dependency: critical, non_commercial_or_proprietary: critical }

# --- 5. Metric-derived findings (maint, coverage, tests, history) ---------------------------------
metric_findings:
  function_complexity:  { ccn_gt: 25, severity: medium, else_ccn_gt: 15, else_severity: low }
  file_duplication:     { dup_pct_gt: 30, severity: low }   # per-file; repo-level goes to scorecard
  build_failed_clean_checkout: high
  flaky_tests:          medium                               # coverage lane `unstable`
  history_only_secret:  same_as_secret                      # removed from HEAD ≠ rotated; severity unchanged

# --- 6. Disposition routing (PRD §8) ---------------------------------------------------------------
disposition:
  auto_confirm:
    lanes: [lint, types, maint, coverage, tests, sca]
    max_severity: medium            # auto-confirm only BELOW high
    sca_requires: known_cve         # SCA auto-confirm only when the advisory has a CVE/GHSA ID
  review_set:                       # always human-dispositioned, at any severity
    lanes: [sast, secrets, iac, license]
    classes: [judgment]
    min_severity_any_lane: high     # anything ≥ high, regardless of lane

# --- 7. Triage scorecard (PRD §5) ----------------------------------------------------------------
# Each metric: green / amber / red thresholds. Verdict rules at the end.
scorecard:
  lint_errors_per_kloc:        { green_lt: 2,   red_gte: 10 }
  type_errors:                 { green_lte: 0,  red_gt: 20,  unavailable: grey }
  duplication_pct:             { green_lt: 3,   red_gt: 8 }
  complex_functions_pct:       { metric: "share of functions with CCN > 15", green_lt: 5, red_gt: 15 }
  dependency_vulns:            { green: "no high/critical", amber: "any high", red: "any critical or any KEV-listed" }
  secrets:                     { green: "none", amber: "history-only", red: "any at HEAD" }
  test_ratio_pct:              { metric: "test LOC / source LOC × 100", green_gte: 50, red_lt: 20 }
  bus_factor:                  { metric: "fewest authors covering 50% of commits in last 12 months", green_gte: 3, red_lte: 1 }
  churn_hotspots:              { metric: "share of churn in files that are also top-decile complexity", green_lt: 20, red_gt: 40 }
  verdict:
    at_risk:          "any red in [secrets, dependency_vulns], OR ≥ 3 reds"
    needs_attention:  "any red, OR ≥ 3 ambers"
    healthy:          "otherwise"
  # Thresholds are first-pass judgment calls. Calibrate after the first 3 engagements (new version).

# --- 8. Remediation effort sizing (PRD §12) ------------------------------------------------------
effort:
  sizes: { S: "< 1 day", M: "1–5 days", L: "> 1 week" }
  defaults:                         # per remediation item, by dominant finding type
    dependency_upgrade_patch_minor: S
    dependency_upgrade_major: M
    secret_rotation: S              # per credential; history rewrite is optional and separate
    sast_single_site: S
    sast_pattern_across_codebase: M
    lint_bulk_autofix: S
    complexity_refactor: M
    authz_model_gap: L
    build_reproducibility: M
    test_coverage_gap_module: M
  # The consultant may override per item in the plan; overrides are recorded as events.
